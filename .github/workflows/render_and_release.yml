name: Cloud Render & Publish to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      prompt_id:
        description: 'Prompt ID from database.json to render'
        required: true
      gemini_api_key:
        description: 'Gemini API Key (optional if saved in Repo Secrets)'
        required: false

permissions:
  contents: write

jobs:
  produce-viral-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Generate 'Charon' Studio Audio & Sync Remotion Scenes
        env:
          PROMPT_ID: ${{ github.event.inputs.prompt_id }}
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: python scripts/cloud_producer.py

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Chromium & FFmpeg Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 ffmpeg

      - name: Install Remotion Dependencies & Render 1080x1920 MP4
        working-directory: ./remotion_studio
        run: |
          npm install
          npx remotion render src/index.ts ViralAgencyReel out/reel_${{ github.event.inputs.prompt_id }}.mp4 --codec=h264

      - name: Publish MP4 & WAV to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PID: ${{ github.event.inputs.prompt_id }}
        run: |
          TAG="reel-${PID}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             "./remotion_studio/out/reel_${PID}.mp4"             "./remotion_studio/public/voiceover.wav"             --title "🎬 Rendered Reel (${PID}) - Run #${GITHUB_RUN_NUMBER}"             --notes "Automatically generated with Gemini 2.5 'Charon' Studio Voice and Remotion 1080x1920 Engine."

      - name: Update database.json with Direct Release Download URL
        env:
          PID: ${{ github.event.inputs.prompt_id }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
        run: |
          python - << 'EOF'
          import os, json, time
          from pathlib import Path
          pid = os.environ["PID"]
          repo = os.environ["REPO"]
          run_no = os.environ["RUN_NO"]
          tag = f"reel-{pid}-{run_no}"
          mp4_url = f"https://github.com/{repo}/releases/download/{tag}/reel_{pid}.mp4"
          wav_url = f"https://github.com/{repo}/releases/download/{tag}/voiceover.wav"
          rel_page = f"https://github.com/{repo}/releases/tag/{tag}"

          db_path = Path("data/database.json")
          db = json.loads(db_path.read_text(encoding="utf-8"))
          for p in db.get("prompts", []):
              if p.get("id") == pid:
                  p["status"] = "completed"
                  p["mp4_url"] = mp4_url
                  p["wav_url"] = wav_url
                  p["release_url"] = rel_page
          db.setdefault("rendered_videos", []).insert(0, {
              "prompt_id": pid,
              "tag": tag,
              "mp4_url": mp4_url,
              "wav_url": wav_url,
              "release_url": rel_page,
              "rendered_at": time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime())
          })
          db_path.write_text(json.dumps(db, ensure_ascii=False, indent=2), encoding="utf-8")
          EOF
          git config user.name "Autonomous-Video-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/database.json
          git commit -m "chore: attach rendered MP4 release link for ${PID}" || true
          git push origin main
